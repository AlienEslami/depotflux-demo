name: Feature proposal
description: Propose a bounded product change
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operational problem before the solution.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: Define observable success, failure behavior and required tests.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Trust boundaries and limitations
      description: Identify authorization, data, OT and deployment implications.
    validations:
      required: true
