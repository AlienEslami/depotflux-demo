name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev-lock.txt

      - name: Audit pinned Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1 bandit==1.9.4
          python -m pip_audit -r requirements-demo-lock.txt --progress-spinner off

      - name: Static security analysis
        run: python -m bandit -q -r aggregator_demo scripts

      - name: Run tests
        run: |
          python -m coverage run -m pytest -q --junitxml=.demo/test-results.xml
          python -m coverage xml -o .demo/coverage.xml
          python -m coverage json -o .demo/coverage.json

      - name: Check versioned API contract
        run: python scripts/export_openapi.py --check

      - name: Import the demonstrator API
        run: python -c "from aggregator_demo.app import app; assert app.version == '0.1.0'"

      - name: Build installable package
        run: python -m build --wheel --no-isolation --outdir .demo/wheels

      - name: Validate Compose topology
        env:
          DEMO_CONTROL_API_KEY: ci-control-placeholder
          DEMO_EMERGENCY_API_KEY: ci-emergency-placeholder
          DEMO_GATEWAY_API_KEY: ci-gateway-placeholder
          DEMO_DATABASE_PASSWORD: ci-database-placeholder
          DEMO_AUTH_MODE: disabled
          DEMO_OPERATOR_API_KEY: ci-operator-placeholder
          DEMO_APPROVER_API_KEY: ci-approver-placeholder
          DEMO_AUDITOR_API_KEY: ci-auditor-placeholder
          DEMO_ADMIN_API_KEY: ci-admin-placeholder
        run: docker compose config --quiet

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Audit dashboard dependencies
        run: npm audit

      - name: Check dashboard source
        run: npm run lint && npx tsc --noEmit

      - name: Build dashboard
        run: npm run build
