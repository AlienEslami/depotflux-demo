name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The frozen reviewer environment currently pins NumPy 2.5.x,
          # whose published wheels require Python 3.12 or newer.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev-lock.txt

      - name: Audit pinned Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements-demo-lock.txt --progress-spinner off
          python -m pip_audit -r requirements-lock.txt --progress-spinner off

      - name: Run tests
        run: python -m pytest -q

      - name: Import the demonstrator API
        run: python -c "from aggregator_demo.app import app; assert app.version == '0.1.0'"

      - name: Validate Compose topology
        env:
          DEMO_CONTROL_API_KEY: ci-control-placeholder
          DEMO_EMERGENCY_API_KEY: ci-emergency-placeholder
          DEMO_GATEWAY_API_KEY: ci-gateway-placeholder
          DEMO_DATABASE_PASSWORD: ci-database-placeholder
        run: docker compose config --quiet

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Audit dashboard dependencies
        run: npm audit

      - name: Check dashboard source
        run: npm run lint && npx tsc --noEmit

      - name: Build dashboard
        run: npm run build
