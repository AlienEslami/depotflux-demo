name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev-lock.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Import the demonstrator API
        run: python -c "from aggregator_demo.app import app; assert app.version == '0.1.0'"
