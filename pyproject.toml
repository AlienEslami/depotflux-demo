[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-aggregator-workflow"
version = "0.1.0"
description = "DepotFlux electric-fleet optimization and synthetic OT security demonstrator"
requires-python = ">=3.12"
dependencies = [
  "alembic",
  "fastapi",
  "flask",
  "highspy",
  "httpx",
  "numpy",
  "openai",
  "openpyxl",
  "pandas",
  "pydantic>=2",
  "pyomo",
  "psycopg[binary]",
  "SQLAlchemy>=2,<3",
  "uvicorn",
]

[project.optional-dependencies]
gurobi = ["gurobipy==13.0.2"]

[project.scripts]
agentic-aggregator = "agentic_workflow.cli:main"
agentic-aggregator-api = "aggregator_demo.cli:main"
agentic-aggregator-worker = "aggregator_demo.worker:main"
depotflux-api = "aggregator_demo.cli:main"
depotflux-worker = "aggregator_demo.worker:main"
depotflux-ot-gateway = "aggregator_demo.ot_gateway:main"
depotflux-plc-simulator = "aggregator_demo.plc_simulator:main"

[tool.setuptools]
packages = ["agentic_workflow", "aggregator_demo"]
py-modules = ["app", "app_rt"]

[tool.setuptools.package-data]
agentic_workflow = ["prompts/*.txt"]
aggregator_demo = ["demo_data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
